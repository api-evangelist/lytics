note: 'Entity-relationship graph for the Lytics CDP. relationships[] are DERIVED mechanically from $ref links between
  components.schemas in the v2 OpenAPI. id_reference_fields[] are derived from property-name frequency across all
  506 schemas and show how the estate is wired: segment_id / segment_ids appear in 162 schema properties combined,
  because virtually every integration job config in the API points back at an audience. Most of the remaining *_id
  fields (advertiser_id, list_id, ad_account_id, adwords_account_id) are THIRD-PARTY identifiers carried inside
  connector job configs, not Lytics entities — that distinction is recorded rather than flattened into the graph.'
core_entities:
- entity: Account
  id: account_id (aid)
  description: A Lytics account. account_id is the most common parameter in the v2 API (1,321 of 1,467 operations);
    one token can reach several accounts.
  paths:
  - /account
  - /account/{id}
  schema: models.AccountResp
- entity: User
  id: id | email | "me"
  description: A human user of the Lytics account, with roles and granular permissions.
  paths:
  - /user
  - /user/{id}
  - /user/{id}/roles
  schema: models.UserResp
- entity: Profile (Entity)
  id: _uid + identity fields
  description: The unified customer profile — the core object of the CDP. Looked up by any identity field/value
    on a table (usually `user`).
  paths:
  - /api/entity/{table}/{fieldname}/{fieldval}
  - /v2/identity/{table}/{field}/{value}
  schema: models.IdentityResponse
- entity: Segment (Audience)
  id: id | slug_name
  description: A behavioural audience defined in FilterQL. The hub of the model — segments are referenced by jobs,
    flows, ML models and content recommendations.
  paths:
  - /segment
  - /segment/{id}
  - /api/segment/{segId}/scan
  schema: models.Segment
- entity: Schema / Field
  id: table + field id
  description: 'Profile schema for a table: fields, mappings, identity config (idconfig) and field ranks.'
  paths:
  - /schema
  - /schema/{table}/field
  - /schema/{table}/idconfig
  - /schema/{table}/mapping
  schema: models.SchemaResponse
- entity: Stream
  id: stream name
  description: A named inbound data stream. Events are posted to /collect/json/{stream} or /collect/bulk/{stream}.
  paths:
  - /stream
  - /stream/{id}/stats
  - /collect/json/{stream}
  schema: models.StreamMetadata
- entity: Connection
  id: id
  description: A configured link to an external system, built on an Auth.
  paths:
  - /connection
  - /connection/{id}
  - /connection/{id}/schema
  schema: models.ConnectionResp
- entity: Auth
  id: id
  description: A stored credential for a provider. The v2 API exposes one path family PER auth type — 379 operations
    across ~126 provider-specific auth types.
  paths:
  - /auth
  - /auth/{type}
  - /auth/{type}/{id}
  schema: models.Auth
- entity: Job / Work
  id: id
  description: 'An import or export workflow instance. The largest surface in the API: 831 operations, one path
    family per integration workflow.'
  paths:
  - /job
  - /job/{id}
  - /job/{id}/pause
  - /job/{id}/resume
  - /job/{id}/kill
  - /job/{id}/logs
  schema: models.JobResponse
- entity: DataModel (Cloud Connect)
  id: id
  description: A warehouse-backed model (BigQuery, Snowflake, Databricks) synced into profiles, with a schedule,
    health and sync errors.
  paths:
  - /datamodel
  - /datamodel/{id}
  schema: models.DataModelResp
- entity: Flow
  id: id
  description: A multi-step campaign/journey with delays, conditional splits, A/B probabilities and export steps.
  paths:
  - /flow/ui
  - /flow/ui/{id}
  - /flow/state
  schema: models.Flow
- entity: ML Model
  id: id
  description: A lookalike / predictive model built on a segment, with a feature-importance and confusion-matrix
    summary.
  paths:
  - /ml
  - /ml/{id}/summary
  schema: models.MLModel
- entity: Template
  id: id
  description: A webhook payload transform, authored in Jsonnet (`jsonnet`) or JavaScript (`js1`).
  paths:
  - /template
  - /template/{id}
  - /template/{id}/test
  schema: models.TemplateTestRequest
- entity: Content Topic / Document
  id: topic label | doc id
  description: 'Content classification and affinity: crawled documents, topics, rollups, taxonomy and recommendations.'
  paths:
  - /api/content/doc
  - /api/content/topic
  - /api/content/recommend/user/{fieldname}/{fieldval}
  schema: null
- entity: Report
  id: id
  description: A saved report composed of components.
  paths:
  - /report
  - /report/{id}
  schema: models.Report
