aid: lytics
name: Lytics
description: >-
  Lytics is a customer data platform (CDP) that provides two concurrent REST APIs for
  managing unified user profiles, behavioral audiences, content affinity scoring,
  campaign flows, and real-time personalization. The v2 API (886 paths / 1,331
  operations) covers accounts, authorizations, connections, schema and identity
  configuration, data models, streams, jobs and ML models; the v1 API still owns data
  collection, personalization, entity lookup and content classification. Lytics ingests
  data from 100+ sources, builds predictive audiences, and activates them across
  advertising networks, email providers, data warehouses and on-site personalization.
  Lytics joined Contentstack in January 2025.
