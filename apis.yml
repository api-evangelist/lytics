  description: >-
    Segment Collections are grouped/named lists of segments.

    Segments that participate in a collection such as **Goals**

    are related.  The Lytics App ui has one predefined collection

    called **Goals** which defines the main funnel of user

    conversions for your company.  Definining this helps our

    Machine Learning understand goals.


    In addition, the Lytics App has a variety of collections for

    *Aspects* on the home page/reporting which are collections of segments

    on related themes.


    * *Email* Collection of aspects related to email behavior.


    * *Web* A variety of aspects of web users.


    * *Ecommerce*
