- aid: lytics:lytics-segmentml-api
  name: Lytics Segment ML API
  description: >-
    SegmentML provides a framework for building custom machine learning

    models directly in Lytics.  Lytics SegmentML models are self-training,

    continuously-updating and real-time.


    SegmentML models are built by identifying:


    1. A segment of users, called the **Target Segment** who exhibit behavior for *prediction*,


    2. A segment of users, called the **Source Segment** to be candidates for model *evaluation*, or scoring.


    Models are built with a variety of pre-selected candidate features, which include behavioral scores
    and content affinities, and can additionally support any custom field available in Lytics user profiles.


    Attributes concerning the SegmentML model's setup configuration are detailed in **SegmentML Create**.
    Attributes concerning the model's results are defined in **SegmentML Model Fetch**.


    Generic attributes from SegmentML model GET and POST:


    | field          | DataType         | Description   |

    |--------------  |------------------|---------------|

    | name           | string           | The model's name

    | state          | string           | The state of the model: Either *building*, *invalid*, or *complete*

    | reason         | string           | If the state is *invalid* the reason will denote the error

    | created        | string           | Date and time the model was created
