aid: lytics
name: Lytics
description: >-
  Lytics is a customer data platform (CDP) that provides a REST API for
  managing unified user profiles, behavioral segments, content affinity
  scoring, campaigns, and real-time personalization integrations. The platform
  enables marketers to ingest data from 100+ sources, build predictive
  audiences, and activate them across advertising networks, email providers,
  data warehouses, and on-site personalization tools.
