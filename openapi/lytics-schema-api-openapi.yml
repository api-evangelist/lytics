components:
  schemas:
    models.Mapping:
      properties:
        created:
          format: date-time
          type: string
        edit_status:
          type: string
        expr:
          description: The LQL expression for the mapping
          type: string
        field:
          description: The target field of the mapping
          type: string
        guard_expr:
          description: The LQL Guard expression for the mapping
          type: string
        id:
          description: The ID of the mapping
          type: string
        managed_by:
          type: string
        modified:
          format: date-time
          type: string
        stream:
          description: The stream associated with the mapping
          type: string
      required:
      - field
      type: object
    v2schemadiff.Diff:
      properties:
        from_val: {}
        property:
          description: Property can be field type, mapping expression, etc.
          type: string
        to_val: {}
      type: object
    models.Field:
      properties:
        assertions:
          $ref: '#/components/schemas/models.Assertions'
        capacity:
          description: Specifies the capacity for fields of type set or map
          type: integer
        created:
          format: date-time
          type: string
        disable_indexing:
          type: boolean
        edit_status:
          type: string
        id:
          description: ID, or name of field
          type: string
        id_config:
          $ref: '#/components/schemas/models.IDConfig'
        is_identifier:
          type: boolean
        is_pii:
          type: boolean
        keep_days:
          description: TTL for fields of type set or map, in days
          type: integer
        keep_duration:
          description: 'TTL for field of type set or map, must match keep_days if both are defined ie: 7d'
          type: string
        longdesc:
          type: string
        managed_by:
          type: string
        mergeop:
          type: string
        modified:
          type: string
        shortdesc:
          type: string
        tags:
          items:
            type: string
          type: array
        type:
          type: string
      type: object
    models.Ranks:
      properties:
        id_config:
          items:
            $ref: '#/components/schemas/models.IDConfig'
          type: array
        id_ranks:
          $ref: '#/components/schemas/models.RankList'
      type: object
    models.RankList:
      properties:
        changes:
          $ref: '#/components/schemas/v2schemadiff.SchemaChange'
        created:
          type: string
        edit_status:
          type: string
        fields:
          items:
            type: string
          type: array
        modified:
          type: string
      type: object
    models.SchemaValidateResponse:
      properties:
        has_unpublished_changes:
          type: boolean
        id:
          description: UUID for this schema version
          type: string
        parent_id:
          type: string
        table:
          type: string
        validation_errors:
          items:
            type: string
          type: array
        version_number:
          type: integer
      type: object
    models.SchemaResponse:
      properties:
        created:
          format: date-time
          type: string
        created_by:
          type: string
        description:
          type: string
        draft_status:
          type: string
        fields:
          items:
            $ref: '#/components/schemas/models.Field'
          type: array
        id:
          description: UUID for this schema version
          type: string
        is_patch:
          type: boolean
        mappings:
          items:
            $ref: '#/components/schemas/models.Mapping'
          type: array
        modified:
          format: date-time
          type: string
        parent_id:
          type: string
        published_by:
          type: string
        ranks:
          $ref: '#/components/schemas/models.Ranks'
        retention_settings:
          $ref: '#/components/schemas/models.RetentionSettings'
        status:
          enum:
          - live
          - draft
          - archived
          type: string
        table:
          type: string
        tag:
          type: string
        version_number:
          type: integer
      type: object
    models.Table:
      properties:
        draft_id:
          type: string
        draft_version:
          type: integer
        live_id:
          type: string
        table:
          type: string
      type: object
    models.SchemaEvalRequest:
      additionalProperties:
        items:
          additionalProperties: true
          type: object
        type: array
      type: object
    models.LQLUploadResponse:
      properties:
        fields:
          items:
            $ref: '#/components/schemas/models.Field'
          type: array
        mappings:
          items:
            $ref: '#/components/schemas/models.Mapping'
          type: array
      type: object
    models.Assertions:
      properties:
        email:
          description: Asserts that the field is an email address
          type: boolean
        filter:
          description: '[]string is the type of v2schema.Filter'
          items:
            type: string
          type: array
        format:
          description: Asserts the format of string fields. If this is set to any value other than "any", the incoming data will be validated against the specified format for all mappings to this field. If the format does not match, the mapping will ignore the input.
          enum:
          - alpha
          - alphanumeric
          - uuid
          - base64
          - hex
          - int
          - any
          type: string
        length:
          properties:
            max:
              description: Maximum length of the field
              type: integer
            min:
              description: Minimum length of the field
              type: integer
          type: object
      type: object
    models.VersionDiff:
      properties:
        diff:
          items:
            $ref: '#/components/schemas/v2schemadiff.SchemaChange'
          type: array
        from:
          $ref: '#/components/schemas/models.SchemaResponse'
        to:
          $ref: '#/components/schemas/models.SchemaResponse'
      type: object
    lioerrors.ApiV2ErrorOut:
      properties:
        code:
          description: Lytics Error Code
          enum:
          - UNKNOWN-000
          - BADREQ-001
          - JOB-BADREQ-002
          - NOTFOUND-003
          - JOB-NOTFOUND-004
          - WF-NOTFOUND-005
          - AUTH-NOTFOUND-006
          - AUTHTYPE-NOTFOUND-007
          - AUTH-BADREQ-008
          - TABLE-NOTFOUND-009
          - SCHEMA-NOTFOUND-010
          - SCHEMAVERSION-NOTFOUND-011
          - ENTITY-NOTFOUND-012
          - QUERY-NOTFOUND-013
          - STREAM-NOTFOUND-014
          - PROVIDER-BADREQ-015
          - PROVIDER-NOTFOUND-016
          - UNAUTHORIZED-017
          - SCHEMA-INVALID-018
          - INTERNAL-019
          - ROUTERULE-NOTFOUND-020
          - ACCOUNT-NOTFOUND-021
          - JOB-FAULT-022
          - USER-NOTFOUND-023
          - USER-BADREQ-024
          - JSON-BADREQ-025
          - FORBIDDEN-026
          type: string
        level:
          description: When the error was generated
          type: string
        message:
          description: A description of the error that occurred
          type: string
        timestamp:
          description: The time the error occurred
          format: date-time
          type: string
      type: object
    models.VersionCommit:
      properties:
        description:
          description: Longer description of changes
          type: string
        tag:
          description: Tag for short-hand reference
          type: string
      type: object
    v2schemadiff.SchemaChange:
      properties:
        diff:
          description: Diff will be empty if verb is "created" or "removed".
          items:
            $ref: '#/components/schemas/v2schemadiff.Diff'
          type: array
        id:
          description: "ID will be field name, mapping ID, rank setting\n field, or empty for \"rank\" source type."
          type: string
        subject:
          enum:
          - mapping
          - field
          - rank
          - rank_setting
          type: string
        verb:
          enum:
          - created
          - removed
          - modified
          type: string
      type: object
    models.ExpressionEvalRequest:
      properties:
        data:
          additionalProperties: true
          type: object
        expression:
          type: string
      type: object
    models.ApiErrorResponse:
      properties:
        errors:
          description: Lytics API Errors
          items:
            $ref: '#/components/schemas/lioerrors.ApiV2ErrorOut'
          type: array
        request_id:
          type: string
        status:
          description: HTTP Status Code
          type: integer
      type: object
    models.IDConfig:
      properties:
        compact_after_days:
          type: integer
        compact_over:
          type: integer
        created:
          type: string
        edit_status:
          type: string
        field:
          type: string
        many_to:
          items:
            type: string
          type: array
        modified:
          type: string
      type: object
    models.RetentionSettings:
      properties:
        capacity:
          type: integer
        created:
          type: string
        edit_status:
          type: string
        keep_days:
          type: integer
        modified:
          type: string
      type: object
    models.ApiResponse:
      properties:
        _meta:
          additionalProperties: true
          description: Response Metadata
          type: object
        data:
          description: Response Payload
          type: object
        request_id:
          type: string
        status:
          description: HTTP Status Code
          type: integer
      type: object
  securitySchemes:
    ApiKeyAuth:
      in: header
      name: Authorization
      type: apiKey
