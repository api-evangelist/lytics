                      coverage: 0.2062
                    message: success
                    status: 200
      security:
      - ApiKeyAuth: []
      summary: Content Topic Cluster
      operationId: Content Topic Cluster
      description: 'Get topics that are related to an input topic.

        This can be useful for creating topic rollups,

        and provide initial suggestions as to which topics

        might best comprise a rollup.


        The options for direction, penalty and threshold

        are currently adjustable.  As we determine which

        values produce the most useful clusters, we can set

        better defaults for them.'
      tags:
      - Content
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: topicId
        in: path
        description: public topic label in the taxonomy
        required: true
        example: Pets
        schema:
          type: string
      - name: direction
        in: query
        description: direction to follow topic dependencies, either "in" or "out"
        required: false
        example: out
        schema:
          type: string
      - name: penalty
        in: query
        description: penalty to apply as traversal depth increases, where a lower value introduces a higher penalty
        required: false
        example: '0.9'
        schema:
          type: string
      - name: threshold
        in: query
        description: threshold at which neighbor topics are determined, where a lower value introduces a more lenient rule
        required: false
