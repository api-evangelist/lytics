              schema:
                $ref: '#/components/schemas/ContentCorpusModel'
              examples:
                response:
                  value:
                    status: 200
                    message: success
                    data:
                      body:
                      - here is some body text
                      source:
                      - upload
                      updated:
                      - 2016-09-13 21:59:38.551972802 -0400 EDT
                      url:
                      - http://www.google.com/
                      version:
                      - '4'
      security:
      - ApiKeyAuth: []
      summary: Content Corpus
      operationId: Content Corpus
      description: "Add a document to the content table corpus.  Either a URL or text must be provided.\nThis allows entry of documents/content that get added to content\ntable, content-graph and available for usage in recommendation, as\nwell as content-explorer.\n\n* **id** if you upload the document more than once, ensure it has common id so only one document is created\n\n* **Custom Attributes**  Any attributes you upload that are not reserved, will be added to content document.\n\n```sh\n\n# Upsert a document into content table and classify it\ncurl -s -XPOST \"https://api.lytics.io/api/content/corpus\" \\\n  -H \"Authorization: $LIOKEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"id\":\"doc_id_123\",\n    \"text\":\"big-long-body-of text for classification\",\n    \"custom_attribute_name\":\"custom attribute\"\n}' | jq '.'\n\n\n# upsert a url into db\n#  url is used as document id\ncurl -s -XPOST \"https://api.lytics.io/api/content/corpus\" \\\n  -H \"Authorization: $LIOKEY\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n    \"url\":\"http://www.validdomain/validurl.html\",\n    \"custom_attribute_name\":\"custom attribute\"\n}' | jq '.'\n\n```"
      tags:
      - Content
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: url
        in: query
        description: the URL for identifying and retrieving content
        required: false
        example: http://www.somedomain.com/blog/great-post
        schema:
          type: string
      - name: text
        in: query
        description: the body of the content to be added
        required: false
        example: here is some body text
        schema:
          type: string
      - name: topics
        in: query
        description: custom topics to append to the document, in addition to topics that will be added with enrichment
        required: false
        example: Data,Hockey
        schema:
          type: string
    servers:
    - url: https://api.lytics.io
