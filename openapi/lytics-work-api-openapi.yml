openapi: 3.2.0
info:
  title: V1 Lytics Work API
  version: 1.0.0
  description: 'The Lytics API is a _restful_ *JSON* api that includes:

    * *Data Collection* api''s for collection, and upload of custom data.'
servers:
- url: https://api.lytics.io
tags:
- name: Work
  description: Work is an *integration* unit, typically for imports and exports.
paths:
  /api/work:
    get:
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkListModel'
              examples:
                response:
                  value:
                    data:
                    - account_id: 4f7b525bdba058fc096757a6
                      aid: 12
                      config:
                        delimiter: null
                        email_to: fake@gmail.com
                        fields: []
                        limit: null
                        segment_id: d5975ab901f7f660845c95ee6aa3cadd
                        table: user
                        write_headers: true
                      hidden: false
                      id: ca756c13469228b723652f1e5168650f
                      created: '2014-08-04T21:18:20.124Z'
                      updated: '2014-08-04T21:18:20.124Z'
                      runtime: ''
                      statuscode: completed
                      deleted: false
                      tag: ''
                      user_id: 50f4c7c6e327a73ae8000004
                      work_state_version: 0
                      workflow: lytics_simple_csv_export
                      workflow_id: 75ce615fdfa048b7a5d5ea41fe7c1260
      security:
      - ApiKeyAuth: []
      summary: Work List
      operationId: Work List
      description: Get list of all running integrations (work) for this account.
      tags:
      - Work
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: showhidden
        in: query
        description: True/False show all hidden work items
        required: false
        schema:
          type: boolean
          default: 'true'
      - name: state
        in: query
        description: True/False show all state
        required: false
        schema:
          type: boolean
          default: 'true'
      - name: showcompleted
        in: query
        description: True/False show all completed work items
        required: false
        schema:
          type: boolean
          default: 'false'
      - name: showdeleted
        in: query
        description: True/False show all deleted work items (works that was deleted using `work/{id}/delete` command)
        required: false
        schema:
          type: boolean
          default: 'false'
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkModel'
              examples:
                response:
                  value:
                    data:
                      account_id: 4f7b525bdba058fc096757a6
                      aid: 12
                      config:
                        delimiter: null
                        email_to: fake@gmail.com
                        fields: []
                        limit: null
                        segment_id: d5975ab901f7f660845c95ee6aa3cadd
                        table: user
                        write_headers: true
                      state: {}
                      statuscode: completed
                      hidden: false
                      id: ca756c13469228b723652f1e5168650f
                      created: '2014-08-04T21:18:20.124Z'
                      updated: '2014-08-04T21:18:20.124Z'
                      runtime: ''
                      deleted: false
                      tag: ''
                      user_id: 50f4c7c6e327a73ae8000004
                      work_state_version: 0
                      workflow: lytics_simple_csv_export
                      workflow_id: 75ce615fdfa048b7a5d5ea41fe7c1260
      security:
      - ApiKeyAuth: []
      summary: Work Create
      operationId: Work Create
      description: 'There are a list of available work-types in the workflow api.


        To create a work unit, there is a *config* block with the work configuration

        settings, with the fields listed in the workflow.


        ```sh


        curl -s -H "Authorization: $LIOKEY" \

        -XPOST "https://api.lytics.io/api/work" -d ''

        {

        "workflow_id":"eventscopy"

        , "name":"Ecommerce Demo Copy"

        , "config":{

        "destination_aid": "2223"

        }

        }

        '' | jq ''.''


        ```'
      tags:
      - Work
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                config:
                  type: object
                  properties:
                    delimiter: {}
                    email_to:
                      type: string
                    fields:
                      type: array
                      items: {}
                    limit: {}
                    segment_id:
                      type: string
                    table:
                      type: string
                    write_headers:
                      type: boolean
                workflow_id:
                  type: string
              example:
                config:
                  delimiter: null
                  email_to: fake@gmail.com
                  fields: []
                  limit: null
                  segment_id: d5975ab901f7f660845c95ee6aa3cadd
                  table: user
                  write_headers: true
                workflow_id: 75ce615fdfa048b7a5d5ea41fe7c1260
