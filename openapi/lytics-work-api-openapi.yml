      operationId: Work Command Post
      description: Send a work command
      tags:
      - Work
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: ''
        required: true
        example: abc123
        schema:
          type: string
      - name: cmd
        in: path
        description: ''
        required: true
        example: '''pause'''
        schema:
          type: string
      - name: for
        in: query
