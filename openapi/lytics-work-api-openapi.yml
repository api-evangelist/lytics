      security:
      - ApiKeyAuth: []
      summary: Work Fetch
      operationId: Work Fetch
      description: Get single work resource
      tags:
      - Work
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: id of work
        required: true
        schema:
          type: string
          default: mycoolwork
    delete:
      responses:
        '204':
          description: No Content
          headers: {}
      security:
      - ApiKeyAuth: []
      summary: Work Delete
      operationId: Work Delete
      description: ''
      tags:
      - Work
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: id
        in: path
        description: id of work
        required: true
        schema:
