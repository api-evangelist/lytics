                      workflow_id: 75ce615fdfa048b7a5d5ea41fe7c1260
      security:
      - ApiKeyAuth: []
      summary: Retrieve Work Status
      operationId: Retrieve Work Status
      description: ''
      tags:
      - Work
      parameters:
      - name: account_id
        in: query
        description: Your Lytics account ID.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: one of runnable, errorwait, paused, killed
        required: false
        schema:
          type: string
          default: runnable
      - name: workflow_id
        in: query
        description: ''
        required: false
        example: 123abc
        schema:
          type: string
      - name: resume
        in: query
        description: True/False for resume this item as well
        required: false
        schema:
          type: boolean
          default: 'true'
      - name: acctid
        in: query
        description: ''
        required: false
        example: 123abc
        schema:
          type: string
